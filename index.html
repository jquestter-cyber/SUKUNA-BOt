  <style>

    * {

      padding: 0;

      box-sizing: border-box;

    }

    body {

      background: #050505;

      color: white;

      font-family: Arial, sans-serif;

      text-align: center;

      min-height: 100vh;

    }

    .container {

      padding: 35px 20px;

      max-width: 600px;

      margin: auto;

    }

    .image-box {

      width: 100%;

      height: 280px;

      border: 1px solid #444;

      display: flex;

      color: #eeeeee;

      color: #888;

      letter-spacing: 4px;

      margin-bottom: 30px;

    }

    .card {

      background: #111;

      border: 1px solid #333;

      border-radius: 15px;

      padding: 25px;

      margin-top: 20px;

    }

    .card h2 {

      color: #ddd;

      margin-bottom: 15px;

    }

    .card p {

      color: #999;

      line-height: 1.7;

    }

    .button {

      display: inline-block;

      margin-top: 20px;

      padding: 14px 28px;

      background: #222;

      color: white;

      border: 1px solid #777;

      border-radius: 8px;

      text-decoration: none;

      font-weight: bold;

    }

    .button:hover {

      background: #444;

    }

    footer {

      margin-top: 45px;

      color: #555;

      font-size: 12px;

    }

</head>
